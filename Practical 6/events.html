<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Events</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <script src="../js/events.js" defer></script>
</head>
<body>
    <header class="header">
        <div class="logo"><img src="../images/Charusat.png" alt="CHARUSAT logo"></div>
        <div class="header-text"><h1>StudentHub Events</h1></div>
    </header>

    <main>
        <div class="content-box">
            <h2>Upcoming Events</h2>
            <label for="eventSearch">Search:</label>
            <input type="text" id="eventSearch" placeholder="Search event...">
            <br><br>
            <label for="eventCategory">Category:</label>
            <select id="eventCategory">
                <option value="all">All Categories</option>
            </select>
            <label for="eventSort">Sort:</label>
            <select id="eventSort">
                <option value="date">Date</option>
                <option value="title">Title</option>
                <option value="category">Category</option>
            </select>
            <p id="eventStatus">Loading events...</p>
            <div id="eventList"></div>
            <p>
                <button id="previousPage" type="button">Previous</button>
                <span id="pageInfo">Page 1</span>
                <button id="nextPage" type="button">Next</button>
            </p>
            <p><a href="dashboard.html">Back to Dashboard</a></p>
        </div>
    </main>
</body>
</html>
