<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <script src="../js/script.js" defer></script>
</head>
<body>
    <header class="header">
        <div class="logo">
            <img src="../images/Charusat.png" alt="Charusat logo">
        </div>
        <div class="header-text">
            <h1>StudentHub Portal</h1>
        </div>
    </header>

    <main>
        <div class="form-box">
            <h2>Student Registration</h2>

            <form id="registrationForm" novalidate>
                <label for="name">Name</label><br>
                <input type="text" id="name" name="name" required>
                <small id="nameError"></small>
                <br><br>

                <label for="email">Email</label><br>
                <input type="email" id="email" name="email" required>
                <small id="emailError"></small>
                <br><br>

                <label for="mobile">Mobile Number</label><br>
                <input type="tel" id="mobile" name="mobile" maxlength="10" required>
                <small id="mobileError"></small>
                <br><br>

                <label for="password">Password</label><br>
                <input type="password" id="password" name="password" required>
                <small id="passwordError"></small>
                <p id="passwordStrength"></p>

                <label for="confirmPassword">Confirm Password</label><br>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
                <small id="confirmPasswordError"></small>
                <br><br>

                <label for="course">Course</label><br>
                <select id="course" name="course" required>
                    <option value="">Select Course</option>
                    <option value="CE">Computer Engineering</option>
                    <option value="IT">Information Technology</option>
                    <option value="CSE">Computer Science</option>
                </select>
                <small id="courseError"></small>
                <br><br>

                <label for="year">Year</label><br>
                <select id="year" name="year" required>
                    <option value="">Select Year</option>
                    <option value="1">First Year</option>
                    <option value="2">Second Year</option>
                    <option value="3">Third Year</option>
                    <option value="4">Fourth Year</option>
                </select>
                <small id="yearError"></small>
                <br><br>

                <fieldset>
                    <legend>Gender</legend>
                    <label><input type="radio" name="gender" value="Male"> Male</label>
                    <label><input type="radio" name="gender" value="Female"> Female</label>
                    <label><input type="radio" name="gender" value="Other"> Other</label>
                    <br>
                    <small id="genderError"></small>
                </fieldset>
                <br>

                <label>
                    <input type="checkbox" id="terms" name="terms">
                    I accept the terms and conditions.
                </label>
                <br>
                <small id="termsError"></small>
                <br><br>

                <input type="submit" value="Register">
            </form>

            <p><a href="login.html">Back to Login</a></p>
        </div>
    </main>
    <footer>
        @2026StudentHub
    </footer>
</body>
</html>
